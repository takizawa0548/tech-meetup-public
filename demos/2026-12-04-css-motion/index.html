<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>デモ 1: View Transitions</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- 「仕組みを見る」モード（描画前に効かせるため、module ではない普通の script） -->
    <script src="./explain.js"></script>
    <style>
      /* ① 別ページへの遷移でもアニメーションさせる宣言（遷移元・遷移先の両方に書く）
         動きを減らす設定の人には有効にしない */
      @media (prefers-reduced-motion: no-preference) {
        @view-transition { navigation: auto; }
      }

      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .grid a { color: inherit; text-decoration: none; }
      .item {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      .item .swatch { aspect-ratio: 4 / 3; }
      .item h2 { font-size: 1rem; margin: 12px 16px 4px; width: fit-content; }
      .item p { margin: 0 16px 16px; font-size: 0.85rem; color: var(--muted); }

      /* ② 遷移の前後で「同じもの」に同じ名前を付ける。名前は要素ごとに一意にする */
      .item { view-transition-name: var(--vt-item); }
      .item .swatch { view-transition-name: var(--vt); }
      .item h2 { view-transition-name: var(--vt-title); }
    </style>
    <!-- blocking="render": 一覧を作り終えるまで描画を待つ（詳細から戻る遷移で、空の画面が撮られないように） -->
    <script type="module" blocking="render" src="./list.js"></script>
  </head>
  <body data-explain-intro="遷移を遅くし、撮影した旧の見た目に赤い実線、新しい画面に緑の点線を付けています。並べ替えやカードのクリックを試してください。">
    <nav class="top">
      <a href="./index.html" aria-current="page">1. View Transitions</a>
      <a href="./scroll.html">2. スクロール連動</a>
      <a href="./has.html">3. :has() とコンテナクエリ</a>
    </nav>
    <main>
      <h1>CSS だけで作る、アプリのような画面遷移</h1>
      <p>
        <strong>並べ替え</strong> は同じページ内の遷移（<code>document.startViewTransition()</code>）、
        <strong>カードをクリック</strong> すると別ページへの遷移（<code>@view-transition</code>）です。
      </p>
      <p class="note">
        このデモは、ファイルを直接開く（file://）と動きません。
        このフォルダで <code>npx serve .</code> などを実行して、ローカルサーバーから開いてください。
      </p>

      <div class="toolbar" role="group" aria-label="並べ替え">
        <button data-sort="hue">色相順</button>
        <button data-sort="name">名前順</button>
        <button data-sort="shuffle">シャッフル</button>
      </div>

      <ul class="grid" id="grid"></ul>
    </main>
  </body>
</html>
