# Please set 'QIITA_TOKEN' secret to your repository
name: Publish articles

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
    steps:
      - name: QIITA_TOKEN 未設定のときは投稿をスキップ
        if: env.QIITA_TOKEN == ''
        run: echo "::notice::QIITA_TOKEN が未設定のため、Qiita への投稿をスキップしました"
      - uses: actions/checkout@v7
        if: env.QIITA_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: increments/qiita-cli/actions/publish@v1
        if: env.QIITA_TOKEN != ''
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
